services:

  db:
    image: postgres:17
    container_name: library-db

    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library

    volumes:
      - library_pg_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U library -d library"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: library-backend

    environment:
      DATABASE_URL: postgresql+psycopg://library:library@db:5432/library
      FRONTEND_ORIGIN: http://localhost:5173

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: library-frontend

    environment:
      VITE_API_URL: http://localhost:8000

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  library_pg_data: